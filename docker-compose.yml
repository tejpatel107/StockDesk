# Use postgres/example user/password credentials

services:

  db:
    image: postgres
    container_name: stockdesk-db
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - "postgres_data:/var/lib/postgresql"
    
volumes:
  postgres_data:
